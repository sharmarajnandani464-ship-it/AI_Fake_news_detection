<!DOCTYPE html><html>
<head>
    <title>News History</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            text-align: center;
        }
        .container {
            background: white;
            width: 80%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
        }
        .item {
            background: #f1f5f9;
            padding: 15px;
            margin: 15px;
            border-radius: 8px;
        }
        a {
            color: blue;
        }
    </style>
</head>
<body><h1>News Detection History</h1><div class="container"><a href="/">Back to Home</a>
    <br><br>
<a href="/clear_history">🗑️ Clear History</a>

{% if history %}
{% for item in history %}
<div class="item">
<p><b>News:</b></p>
<p>{{ item.news }}</p>
<p><b>Prediction:</b> {{ item.prediction }}</p>
<p><b>Time:</b> {{ item.time }}</p>
</div>
{% endfor %}
{% else %}
<p>No history available.</p>
{% endif %}

</div>
</body>
</html>
